<div id="modalLayer"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const CATS = {
    soprano: { label:"Soprano", glyph:"🎤" },
    alto:    { label:"Alto",    glyph:"🎤" },
    tenor:   { label:"Ténor",   glyph:"🎤" },
    basse:   { label:"Basse",   glyph:"🎤" }
  };
  const DEFAULT_CAT = "soprano";
  function normalizeCategory(cat){
    return (cat && CATS[cat]) ? cat : DEFAULT_CAT;
  }

  let folders = [];    // {id, name, createdAt} — chaque dossier est un « chant »
  let currentFolderId = null; // null = écran des chants
  let files = [];      // {id, folderId, file, name, category, url, thumb, addedAt}
  let idSeq = 1;
  let folderIdSeq = 1;
  let activeCat = "all";
  let viewMode = "grid";
  let searchTerm = "";
  let pendingFile = null; // file awaiting preview/confirm

  const drawerEl = document.getElementById('drawer');
  const contentEl = document.getElementById('content');
  const sectionTitle = document.getElementById('sectionTitle');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const modalLayer = document.getElementById('modalLayer');
  const toastEl = document.getElementById('toast');
  const foldersScreen = document.getElementById('foldersScreen');
  const folderScreen = document.getElementById('folderScreen');
  const folderGrid = document.getElementById('folderGrid');
  const folderTitle = document.getElementById('folderTitle');
  const searchwrap = document.getElementById('searchwrap');

  function extOf(name){
    const m = /\.([a-z0-9]+)$/i.exec(name);
    return m ? m[1].toLowerCase() : "";
  }

  // Le type de fichier ne détermine plus le pupitre (choisi manuellement) — il sert
  // uniquement à choisir une icône cohérente dans les vignettes et à orienter l'aperçu.
  function fileTypeInfo(file){
    const type = (file && file.type) || "";
    const ext = extOf((file && file.name) || "");
    if(type.startsWith("video/") || ["mp4","mov","avi","mkv","webm","m4v"].includes(ext)) return { kind:"video", glyph:"🎬" };
    if(type.startsWith("audio/") || ["mp3","wav","ogg","flac","m4a","aac"].includes(ext)) return { kind:"audio", glyph:"🎵" };
    if(type.startsWith("image/") || ["jpg","jpeg","png","gif","webp","svg","bmp","heic","tiff"].includes(ext)) return { kind:"image", glyph:"🖼️" };
    if(type === "application/pdf" || ext === "pdf") return { kind:"pdf", glyph:"📄" };
    if(type.startsWith("text/") || ["txt","md","csv"].includes(ext)) return { kind:"text", glyph:"📄" };
    return { kind:"autre", glyph:"🗂️" };
  }

  function formatSize(bytes){
    if(bytes < 1024) return bytes + " o";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " Ko";
    if(bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + " Mo";
    return (bytes/(1024*1024*1024)).toFixed(2) + " Go";
  }

  function formatDate(d){
    return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }) + " · " +
           d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  // ---------- Sauvegarde locale (IndexedDB) ----------
  // Stocke le fichier (blob) et ses métadonnées directement dans le navigateur,
  // pour que le classeur soit encore rempli la prochaine fois que ce fichier HTML est ouvert.
  const DB_NAME = "archiveFichiersDB";
  const STORE_NAME = "files";
  const FOLDERS_STORE = "folders";
  const SETTINGS_STORE = "settings";
  const DB_VERSION = 3;
  let dbInstance = null;

  function openDB(){
    return new Promise((resolve, reject)=>{
      if(dbInstance){ resolve(dbInstance); return; }
      if(!window.indexedDB){ reject(new Error("indexedDB indisponible")); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE_NAME)){
          db.createObjectStore(STORE_NAME, { keyPath:"id", autoIncrement:true });
        }
        if(!db.objectStoreNames.contains(FOLDERS_STORE)){
          db.createObjectStore(FOLDERS_STORE, { keyPath:"id", autoIncrement:true });
        }
        if(!db.objectStoreNames.contains(SETTINGS_STORE)){
          db.createObjectStore(SETTINGS_STORE, { keyPath:"key" });
        }
      };
      req.onsuccess = (e)=>{ dbInstance = e.target.result; resolve(dbInstance); };
      req.onerror = ()=> reject(req.error);
    });
  }

  async function dbAdd(record, storeName){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName || STORE_NAME, "readwrite");
      const store = tx.objectStore(storeName || STORE_NAME);
      const req = store.add(record);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }

  async function dbPut(record, storeName){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName || STORE_NAME, "readwrite");
      const req = tx.objectStore(storeName || STORE_NAME).put(record);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }

  async function dbGetOne(key, storeName){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName || STORE_NAME, "readonly");
      const req = tx.objectStore(storeName || STORE_NAME).get(key);
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error);
    });
  }

  async function dbDelete(id, storeName){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName || STORE_NAME, "readwrite");
      tx.objectStore(storeName || STORE_NAME).delete(id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }

  async function dbGetAll(storeName){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName || STORE_NAME, "readonly");
      const req = tx.objectStore(storeName || STORE_NAME).getAll();
      req.onsuccess = ()=> resolve(req.result || []);
      req.onerror = ()=> reject(req.error);
    });
  }

  async function getSetting(key){
    try{
      const rec = await dbGetOne(key, SETTINGS_STORE);
      return rec ? rec.value : null;
    }catch(e){ return null; }
  }
  async function setSetting(key, value){
    try{ await dbPut({ key, value }, SETTINGS_STORE); }catch(e){ /* pas grave */ }
  }

  async function dbUpdateFileStatus(id, patch){
    try{
      const rec = await dbGetOne(id, STORE_NAME);
      if(!rec) return;
      Object.assign(rec, patch);
      rec.id = id;
      await dbPut(rec, STORE_NAME);
    }catch(e){ /* le statut reste au moins à jour en mémoire */ }
  }

  async function dbUpdateFolder(id, patch){
    try{
      const rec = await dbGetOne(id, FOLDERS_STORE);
      if(!rec) return;
      Object.assign(rec, patch);
      rec.id = id;
      await dbPut(rec, FOLDERS_STORE);
    }catch(e){ /* pas grave, reste en mémoire pour cette session */ }
  }

  let localSaveAvailable = true;
  let appRole = null; // 'admin' | 'reader'
  let readerApiKey = null;
  let readerRootFolderId = null;

  // ---------- Google Drive ----------
  let driveClientId = null;
  let accessToken = null;
  let tokenExpiresAt = 0;
  let gisTokenClient = null;
  let driveConnected = false;
  let driveArchiveRootId = null;
  let connectedAccountEmail = null;

  const driveStatusPill = document.getElementById('driveStatusPill');

  function updateDriveStatusUI(){
    if(appRole === 'reader'){
      driveStatusPill.textContent = readerRootFolderId ? "lecture" : "non configuré";
      driveStatusPill.className = readerRootFolderId ? "connected" : "";
      updateReconnectBanner();
      return;
    }
    if(!driveClientId){
      driveStatusPill.textContent = "non configuré";
      driveStatusPill.className = "";
    } else if(driveConnected){
      driveStatusPill.textContent = "connecté";
      driveStatusPill.className = "connected";
    } else {
      driveStatusPill.textContent = "non connecté";
      driveStatusPill.className = "";
    }
    updateReconnectBanner();
  }

  function updateReconnectBanner(){
    const banner = document.getElementById('reconnectBanner');
    if(appRole === 'admin' && driveClientId && !driveConnected){
      banner.style.display = "flex";
      banner.innerHTML = `<span>Connexion Google Drive interrompue — les nouveaux fichiers restent en attente d'envoi.</span><button id="reconnectNowBtn">Se reconnecter</button>`;
      document.getElementById('reconnectNowBtn').addEventListener('click', manualReconnect);
    } else {
      banner.style.display = "none";
      banner.innerHTML = "";
    }
  }

  async function manualReconnect(){
    try{
      await ensureToken();
      retrySyncQueue();
      showToast("Reconnecté à Google Drive.");
    }catch(e){
      connectDrive();
    }
  }

  function loadGisScript(){
    return new Promise((resolve, reject)=>{
      if(window.google && window.google.accounts){ resolve(); return; }
      let tries = 0;
      const check = setInterval(()=>{
        tries++;
        if(window.google && window.google.accounts){ clearInterval(check); resolve(); }
        else if(tries > 40){ clearInterval(check); reject(new Error("Google Identity Services indisponible")); }
      }, 150);
    });
  }

  async function fetchAccountEmail(token){
    try{
      const resp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:`Bearer ${token}` }});
      if(!resp.ok) return null;
      const data = await resp.json();
      return data.email || null;
    }catch(e){ return null; }
  }

  // Si le compte connecté a changé depuis la dernière fois, les dossiers Drive mis en
  // cache appartiennent à l'ancien compte et deviennent inaccessibles : on repart à zéro
  // proprement plutôt que de laisser les envois échouer silencieusement.
  async function reconcileAccount(newEmail){
    const storedEmail = await getSetting('driveAccountEmail');
    connectedAccountEmail = newEmail || storedEmail || null;
    if(storedEmail && newEmail && storedEmail !== newEmail){
      driveArchiveRootId = null;
      await setSetting('driveArchiveRootId', null);
      for(const fold of folders){
        fold.driveFolderId = null;
        fold.driveSubfolders = null;
        await dbUpdateFolder(fold.id, { driveFolderId: null, driveSubfolders: null });
      }
      for(const f of files){
        f.driveStatus = 'pending';
        f.driveFileId = null;
        await dbUpdateFileStatus(f.id, { driveStatus:'pending', driveFileId:null });
      }
      await setSetting('driveAccountEmail', newEmail);
      showToast("Compte Google différent détecté — un nouveau classeur Drive sera recréé sous ce compte.");
      if(currentFolderId !== null) renderAll(); else renderFoldersScreen();
    } else if(newEmail && newEmail !== storedEmail){
      await setSetting('driveAccountEmail', newEmail);
    }
  }

  async function driveDownloadBlob(fileId){
    const resp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    return await resp.blob();
  }

  // Récupère le contenu déjà présent sur le Drive (créé depuis un autre appareil) et le
  // rapatrie dans le stockage local de cet appareil-ci, pour que l'administrateur retrouve
  // le même classeur partout, pas seulement là où les fichiers ont été ajoutés en premier.
  let pullInProgress = false;
  async function pullFromDriveForAdmin(silent){
    if(pullInProgress) return;
    pullInProgress = true;
    if(!silent) showToast("Récupération du contenu depuis Drive…");
    try{
      if(!driveArchiveRootId){
        const found = await driveFindFolder('Archive (classeur personnel)', null);
        if(!found){ pullInProgress = false; if(!silent) showToast("Rien à récupérer pour l'instant."); return; }
        driveArchiveRootId = found;
        await setSetting('driveArchiveRootId', driveArchiveRootId);
      }

      const songDirsResp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${driveArchiveRootId}' in parents and trashed=false and mimeType='application/vnd.google-apps.folder'`)}&fields=files(id,name)`);
      const songDirs = (await songDirsResp.json()).files || [];

      let addedFiles = 0;
      for(const sd of songDirs){
        let localFolder = folders.find(f => f.driveFolderId === sd.id || f.name === sd.name);
        if(!localFolder){
          localFolder = { id: folderIdSeq++, name: sd.name, createdAt: new Date(), driveFolderId: sd.id, driveSubfolders: null };
          folders.push(localFolder);
          try{
            const dbId = await dbAdd({ name: localFolder.name, createdAt: localFolder.createdAt.toISOString(), driveFolderId: sd.id }, FOLDERS_STORE);
            localFolder.id = dbId;
          }catch(e){}
        } else if(!localFolder.driveFolderId){
          localFolder.driveFolderId = sd.id;
          await dbUpdateFolder(localFolder.id, { driveFolderId: sd.id });
        }

        const catDirsResp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${sd.id}' in parents and trashed=false and mimeType='application/vnd.google-apps.folder'`)}&fields=files(id,name)`);
        const catDirs = (await catDirsResp.json()).files || [];
        const subMap = localFolder.driveSubfolders || {};

        for(const cd of catDirs){
          const catKey = Object.keys(CATS).find(k => CATS[k].label === cd.name);
          if(!catKey) continue;
          subMap[catKey] = cd.id;

          const filesResp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${cd.id}' in parents and trashed=false`)}&fields=files(id,name,size,modifiedTime,mimeType)`);
          const driveFiles = (await filesResp.json()).files.filter(x => x.mimeType !== 'application/vnd.google-apps.folder') || [];

          for(const df of driveFiles){
            if(files.some(f => f.driveFileId === df.id)) continue; // déjà présent ici
            try{
              const blob = await driveDownloadBlob(df.id);
              const url = URL.createObjectURL(blob);
              const entry = {
                id: idSeq++,
                folderId: localFolder.id,
                file: blob,
                name: df.name,
                category: catKey,
                size: Number(df.size) || blob.size,
                url,
                thumb: null,
                addedAt: df.modifiedTime ? new Date(df.modifiedTime) : new Date(),
                driveStatus: 'synced',
                driveFileId: df.id
              };
              files.push(entry);
              addedFiles++;
              try{
                const dbId = await dbAdd({ folderId: localFolder.id, name: entry.name, category: catKey, size: entry.size, addedAt: entry.addedAt.toISOString(), blob, driveStatus:'synced', driveFileId: df.id });
                entry.id = dbId;
              }catch(e){}
              if(catKey && fileTypeInfo(blob).kind === 'video'){
                makeVideoThumb(url, (dataUrl)=>{ if(dataUrl){ entry.thumb = dataUrl; if(viewMode==='grid') renderAll(); } });
              }
            }catch(e){ /* ce fichier sera retenté à la prochaine récupération */ }
          }
        }
        localFolder.driveSubfolders = subMap;
        await dbUpdateFolder(localFolder.id, { driveSubfolders: subMap });
      }

      if(currentFolderId !== null) renderAll(); else renderFoldersScreen();
      if(!silent) showToast(addedFiles > 0 ? (addedFiles + " fichier(s) récupéré(s) depuis Drive.") : "Vous étiez déjà à jour.");
    }catch(e){
      if(!silent) showToast("Échec de la récupération depuis Drive.");
    }
    pullInProgress = false;
  }

  async function handleTokenAcquired(resp){
    accessToken = resp.access_token;
    tokenExpiresAt = Date.now() + ((resp.expires_in || 3600) * 1000);
    driveConnected = true;
    updateDriveStatusUI();
    const email = await fetchAccountEmail(accessToken);
    await reconcileAccount(email);
    updateDriveStatusUI();
    if(appRole === 'admin'){
      await pullFromDriveForAdmin(true); // toujours vérifier, pas seulement si totalement vide
    }
  }

  async function initGis(clientId){
    try{
      await loadGisScript();
    }catch(e){
      showToast("Impossible de charger Google (vérifiez votre connexion).");
      return;
    }
    gisTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
      callback: async (resp)=>{
        if(resp.error){
          driveConnected = false;
          updateDriveStatusUI();
          return;
        }
        await handleTokenAcquired(resp);
        showToast("Connecté à Google Drive.");
        retrySyncQueue();
      }
    });
  }

  function connectDrive(){
    if(!gisTokenClient){ showToast("Enregistrez d'abord un Client ID valide."); return; }
    gisTokenClient.requestAccessToken({ prompt: 'consent' });
  }

  function disconnectDrive(){
    if(accessToken && window.google){
      try{ google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}
    }
    fetch('/.netlify/functions/drive-disconnect', { credentials:'include' }).catch(()=>{});
    accessToken = null;
    tokenExpiresAt = 0;
    driveConnected = false;
    connectedAccountEmail = null;
    updateDriveStatusUI();
    showToast("Déconnecté de Google Drive.");
  }

  // Connexion permanente (nécessite les fonctions serveur — voir guide de déploiement).
  // Si elles ne sont pas déployées, cet appel échoue simplement et on repasse par GIS.
  async function tryBackendToken(){
    try{
      const resp = await fetch('/.netlify/functions/drive-access-token', { credentials:'include' });
      if(!resp.ok) return null;
      const data = await resp.json();
      if(!data.access_token) return null;
      return data;
    }catch(e){ return null; }
  }

  function startPermanentConnect(){
    window.location.href = '/.netlify/functions/drive-auth-start';
  }

  function ensureToken(){
    return new Promise(async (resolve, reject)=>{
      if(accessToken && Date.now() < tokenExpiresAt - 60000){ resolve(accessToken); return; }

      const backend = await tryBackendToken();
      if(backend){
        accessToken = backend.access_token;
        tokenExpiresAt = Date.now() + ((backend.expires_in || 3600) * 1000);
        driveConnected = true;
        updateDriveStatusUI();
        const email = await fetchAccountEmail(accessToken);
        await reconcileAccount(email);
        updateDriveStatusUI();
        if(appRole === 'admin') pullFromDriveForAdmin(true);
        resolve(accessToken);
        return;
      }

      if(!gisTokenClient){ reject(new Error("Drive non configuré")); return; }
      gisTokenClient.callback = async (resp)=>{
        if(resp.error){ driveConnected = false; updateDriveStatusUI(); reject(new Error(resp.error)); return; }
        await handleTokenAcquired(resp);
        resolve(accessToken);
      };
      gisTokenClient.requestAccessToken({ prompt: '' });
    });
  }

  async function driveApiFetch(url, options){
    const token = await ensureToken();
    const resp = await fetch(url, {
      ...options,
      headers: { ...(options && options.headers), Authorization: `Bearer ${token}` }
    });
    if(!resp.ok){
      const errText = await resp.text().catch(()=> "");
      throw new Error("Drive API error " + resp.status + " " + errText.slice(0,200));
    }
    return resp;
  }

  async function driveFindFolder(name, parentId){
    const safe = name.replace(/'/g, "\\'");
    const parentClause = parentId ? `'${parentId}' in parents` : `'root' in parents`;
    const q = encodeURIComponent(`name='${safe}' and mimeType='application/vnd.google-apps.folder' and trashed=false and ${parentClause}`);
    const resp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
    const data = await resp.json();
    return (data.files && data.files[0]) ? data.files[0].id : null;
  }

  async function driveCreateFolder(name, parentId){
    const metadata = { name, mimeType:'application/vnd.google-apps.folder' };
    if(parentId) metadata.parents = [parentId];
    const resp = await driveApiFetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(metadata)
    });
    const data = await resp.json();
    return data.id;
  }

  async function driveFindOrCreateFolder(name, parentId){
    let id = await driveFindFolder(name, parentId);
    if(!id) id = await driveCreateFolder(name, parentId);
    return id;
  }

  async function driveUploadFile(blob, name, parentId){
    const metadata = { name, parents:[parentId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type:'application/json' }));
    form.append('file', blob);
    const resp = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST',
      body: form
    });
    const data = await resp.json();
    return data.id;
  }

  async function getDriveCategoryFolderId(localFolder, category){
    if(!driveArchiveRootId){
      driveArchiveRootId = await driveFindOrCreateFolder('Archive (classeur personnel)', null);
      await setSetting('driveArchiveRootId', driveArchiveRootId);
    }
    if(!localFolder.driveFolderId){
      localFolder.driveFolderId = await driveFindOrCreateFolder(localFolder.name, driveArchiveRootId);
      await dbUpdateFolder(localFolder.id, { driveFolderId: localFolder.driveFolderId });
    }
    if(!localFolder.driveSubfolders) localFolder.driveSubfolders = {};
    if(!localFolder.driveSubfolders[category]){
      localFolder.driveSubfolders[category] = await driveFindOrCreateFolder(CATS[category].label, localFolder.driveFolderId);
      await dbUpdateFolder(localFolder.id, { driveSubfolders: localFolder.driveSubfolders });
    }
    return localFolder.driveSubfolders[category];
  }

  async function syncFileToDrive(entry){
    if(!driveClientId) return;
    entry.driveStatus = 'syncing';
    if(currentFolderId === entry.folderId) renderAll();
    try{
      const fold = folders.find(f => f.id === entry.folderId);
      if(!fold) throw new Error("dossier introuvable");
      const parentId = await getDriveCategoryFolderId(fold, entry.category);
      const fileId = await driveUploadFile(entry.file, entry.name, parentId);
      entry.driveStatus = 'synced';
      entry.driveFileId = fileId;
      await dbUpdateFileStatus(entry.id, { driveStatus:'synced', driveFileId:fileId });
    }catch(e){
      entry.driveStatus = driveConnected ? 'error' : 'pending';
      await dbUpdateFileStatus(entry.id, { driveStatus: entry.driveStatus });
    }
    if(currentFolderId === entry.folderId) renderAll();
  }

  function retrySyncQueue(){
    if(!driveClientId || !driveConnected) return;
    files.filter(f => f.driveStatus === 'pending' || f.driveStatus === 'error').forEach(f => syncFileToDrive(f));
  }

  function driveBadge(entry){
    if(!driveClientId) return "";
    const status = entry.driveStatus || 'pending';
    const map = {
      pending: { icon:"⏳", title:"En attente de connexion Drive — cliquez pour réessayer", clickable:true },
      syncing: { icon:"↻", title:"Envoi vers Drive en cours…", clickable:false },
      synced:  { icon:"☁︎", title:"Sauvegardé sur Google Drive", clickable:false },
      error:   { icon:"⚠", title:"Échec de l'envoi — cliquez pour réessayer", clickable:true }
    };
    const info = map[status] || map.pending;
    return { ...info, status };
  }

  // ---------- Mode Lecteur : lecture publique du Drive (sans connexion) ----------
  async function driveKeyFetchChildren(folderId){
    const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
    const fields = encodeURIComponent('files(id,name,mimeType,size,modifiedTime)');
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&key=${readerApiKey}&pageSize=1000`);
    if(!resp.ok){
      let detail = "";
      try{
        const errData = await resp.json();
        detail = (errData.error && errData.error.message) ? errData.error.message : JSON.stringify(errData);
      }catch(e){ detail = await resp.text().catch(()=> ""); }
      const err = new Error(detail || ("Erreur " + resp.status));
      err.status = resp.status;
      throw err;
    }
    const data = await resp.json();
    return data.files || [];
  }

  function extractDriveFolderId(input){
    const s = input.trim();
    const m = s.match(/\/folders\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    return m ? m[1] : s;
  }

  function showDriveErrorModal(message){
    const modal = buildModal(`
      <div class="eyebrow">Connexion impossible</div>
      <h3>Google a refusé la lecture</h3>
      <div class="infoline" style="color:var(--stamp-red);">${escapeHtml(message)}</div>
      <div class="infoline">ID de dossier utilisé par l'app : <strong>${readerRootFolderId ? escapeHtml(readerRootFolderId) : "(vide — c'est probablement le problème)"}</strong></div>
      <div class="infoline">Vérifiez ces points chez l'administrateur :</div>
      <ul style="font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--ink-soft); line-height:1.7; padding-left:18px; margin:0 0 14px;">
        <li>Le dossier est bien partagé « Anyone with the link → Lecteur » sur Drive</li>
        <li>La clé API a « Google Drive API » activée sur le même projet Google Cloud</li>
        <li>Si la clé a une restriction de site (référent HTTP), elle inclut bien cette adresse</li>
        <li>L'ID collé est bien l'identifiant du dossier seul, pas l'adresse complète</li>
      </ul>
      <div class="actions">
        <button class="btn" id="driveErrClose">Fermer</button>
      </div>
    `);
    modal.querySelector('#driveErrClose').addEventListener('click', closeModal);
  }

  async function loadReaderData(silent){
    if(!readerApiKey || !readerRootFolderId){ renderFoldersScreen(); return; }
    if(!silent) showToast("Chargement depuis Google Drive…");
    const wasInFolder = currentFolderId !== null;
    const currentFolderName = wasInFolder ? (folderTitle.textContent || "") : null;
    try{
      folders = [];
      files = [];
      const rootChildren = await driveKeyFetchChildren(readerRootFolderId);
      const folderDirs = rootChildren.filter(f => f.mimeType === 'application/vnd.google-apps.folder');
      let fSeq = 1, iSeq = 1;
      for(const fd of folderDirs){
        const localFolder = { id: fSeq++, name: fd.name, createdAt: new Date(fd.modifiedTime || Date.now()), driveFolderId: fd.id };
        folders.push(localFolder);
        const catDirs = await driveKeyFetchChildren(fd.id);
        for(const cd of catDirs.filter(c => c.mimeType === 'application/vnd.google-apps.folder')){
          const catKey = Object.keys(CATS).find(k => CATS[k].label === cd.name) || DEFAULT_CAT;
          const inCat = await driveKeyFetchChildren(cd.id);
          inCat.filter(x => x.mimeType !== 'application/vnd.google-apps.folder').forEach(x=>{
            files.push({
              id: iSeq++,
              folderId: localFolder.id,
              file: null,
              name: x.name,
              category: catKey,
              size: Number(x.size) || 0,
              url: null,
              driveFileId: x.id,
              thumb: null,
              addedAt: new Date(x.modifiedTime || Date.now())
            });
          });
        }
      }

      if(wasInFolder){
        const stillThere = folders.find(f => f.name === currentFolderName);
        if(stillThere){
          currentFolderId = stillThere.id;
          renderAll();
        } else {
          currentFolderId = null;
          foldersScreen.style.display = "block";
          folderScreen.style.display = "none";
          searchwrap.style.display = "none";
          renderFoldersScreen();
        }
      } else {
        renderFoldersScreen();
      }
      if(!silent) showToast("Classeur chargé depuis Drive.");
    }catch(e){
      if(!silent){
        renderFoldersScreen();
        showDriveErrorModal(e.message || "Erreur inconnue");
      }
      // en arrière-plan, on retente simplement au prochain cycle sans déranger la personne
    }
  }

  let readerPollTimer = null;
  function startReaderPolling(){
    if(readerPollTimer) clearInterval(readerPollTimer);
    readerPollTimer = setInterval(()=>{
      if(appRole === 'reader' && readerApiKey && readerRootFolderId && !document.hidden){
        loadReaderData(true);
      }
    }, 20000);
  }
  function stopReaderPolling(){
    if(readerPollTimer){ clearInterval(readerPollTimer); readerPollTimer = null; }
  }

  // ---------- Video thumbnail capture ----------
  function makeVideoThumb(url, cb){
    try{
      const v = document.createElement('video');
      v.src = url; v.muted = true; v.playsInline = true; v.preload = "metadata";
      v.addEventListener('loadeddata', ()=>{
        try{
          v.currentTime = Math.min(1, (v.duration||1) * 0.1);
        }catch(e){ cb(null); }
      });
      v.addEventListener('seeked', ()=>{
        try{
          const canvas = document.createElement('canvas');
          canvas.width = 160; canvas.height = 96;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL('image/jpeg', 0.7));
        }catch(e){ cb(null); }
      });
      v.addEventListener('error', ()=> cb(null));
    }catch(e){ cb(null); }
  }

  // ---------- Rendering ----------
  function filesInFolder(){
    return files.filter(f => f.folderId === currentFolderId);
  }

  function renderDrawer(){
    const scoped = filesInFolder();
    const counts = { all: scoped.length };
    Object.keys(CATS).forEach(k => counts[k] = 0);
    scoped.forEach(f => counts[normalizeCategory(f.category)]++);
    const tabs = [["all","Tous"], ...Object.entries(CATS).map(([k,v])=>[k, v.label])];
    drawerEl.innerHTML = "";
    tabs.forEach(([key,label])=>{
      const btn = document.createElement('button');
      btn.type = "button";
      btn.setAttribute('aria-pressed', key===activeCat ? "true":"false");
      btn.innerHTML = `<span>${label}</span><span class="n">${counts[key]}</span>`;
      btn.addEventListener('click', ()=>{ activeCat = key; renderAll(); });
      drawerEl.appendChild(btn);
    });
    const note = document.createElement('div');
    note.className = "drawer-note";
    note.textContent = localSaveAvailable
      ? "Vos fichiers sont sauvegardés dans ce navigateur. Rouvrez ce fichier HTML plus tard, ici, et le classeur sera toujours rempli. Rien n'est envoyé sur un serveur."
      : "Sauvegarde locale indisponible dans cet aperçu. Les fichiers restent en mémoire pour cette session. Téléchargez le fichier HTML et ouvrez-le directement dans votre navigateur pour activer la sauvegarde.";
    drawerEl.appendChild(note);
  }

  function currentList(){
    let list = filesInFolder();
    if(activeCat !== "all") list = list.filter(f => normalizeCategory(f.category) === activeCat);
    if(searchTerm.trim()) list = list.filter(f => f.name.toLowerCase().includes(searchTerm.trim().toLowerCase()));
    return list.slice().sort((a,b)=> b.addedAt - a.addedAt);
  }

  function renderAll(){
    if(currentFolderId === null) return; // rien à afficher hors d'un chant
    renderDrawer();
    const titleMap = { all:"Tous les fichiers" };
    Object.entries(CATS).forEach(([k,v]) => { titleMap[k] = v.label; });
    sectionTitle.textContent = titleMap[activeCat];
    const list = currentList();

    if(list.length === 0){
      contentEl.innerHTML = "";
      const empty = document.createElement('div');
      empty.className = "empty";
      if(filesInFolder().length === 0){
        empty.innerHTML = `<div class="glyph">🎼</div><h3>Ce chant est vide</h3><p>Ajoutez un premier fichier ci-dessus pour commencer à le ranger par pupitre.</p>`;
      } else {
        empty.innerHTML = `<div class="glyph">🔎</div><h3>Aucun résultat</h3><p>Aucun fichier ne correspond à ce pupitre ou à cette recherche.</p>`;
      }
      contentEl.appendChild(empty);
      return;
    }

    if(viewMode === "grid") renderGrid(list); else renderListView(list);
  }

  function stampMarkup(cat){
    const key = normalizeCategory(cat);
    return `<div class="stamp ${key}">${CATS[key].label.slice(0,6)}</div>`;
  }

  function renderGrid(list){
    contentEl.innerHTML = "";
    const grid = document.createElement('div');
    grid.className = "grid";
    list.forEach(f=>{
      const card = document.createElement('div');
      card.className = "card";
      card.tabIndex = 0;
      const badge = appRole === 'admin' ? driveBadge(f) : "";
      const catKey = normalizeCategory(f.category);
      card.innerHTML = `
        <div class="accent-bar" style="background:var(--${catKey}-color);"></div>
        <div class="thumb">${ f.thumb ? `<img src="${f.thumb}" alt="">` : `<span class="glyph">${fileTypeInfo(f.file || {name:f.name}).glyph}</span>` }</div>
        ${badge ? `<div class="sync-badge${badge.clickable?' clickable':''}" data-syncid="${f.id}" data-status="${badge.status}" title="${badge.title}">${badge.icon}</div>` : ""}
        <div class="meta">
          ${stampMarkup(f.category)}
          <div class="name" style="margin-top:6px;">${escapeHtml(f.name)}</div>
          <div class="sub"><span>${formatSize(f.size)}</span><span>${f.addedAt.toLocaleDateString('fr-FR')}</span></div>
        </div>
        ${appRole === 'admin' ? `<button class="delbtn" data-id="${f.id}">retirer</button>` : ""}
      `;
      card.addEventListener('click', (e)=>{
        if(e.target.classList.contains('delbtn') || e.target.closest('.sync-badge')) return;
        openViewer(f);
      });
      card.addEventListener('keypress', (e)=>{ if(e.key==='Enter') openViewer(f); });
      grid.appendChild(card);
    });
    contentEl.appendChild(grid);
    contentEl.querySelectorAll('.delbtn').forEach(b=>{
      b.addEventListener('click', (e)=>{ e.stopPropagation(); confirmDelete(Number(b.dataset.id)); });
    });
    contentEl.querySelectorAll('.sync-badge.clickable').forEach(b=>{
      b.addEventListener('click', (e)=>{
        e.stopPropagation();
        const entry = files.find(x=>x.id===Number(b.dataset.syncid));
        if(entry) syncFileToDrive(entry);
      });
    });
  }

  function renderListView(list){
    contentEl.innerHTML = "";
    const table = document.createElement('table');
    table.className = "list";
    table.innerHTML = `
      <thead><tr><th>Nom</th><th>Type</th><th>Taille</th><th>Ajouté le</th><th></th></tr></thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');
    list.forEach(f=>{
      const tr = document.createElement('tr');
      tr.className = "row";
      const badge = appRole === 'admin' ? driveBadge(f) : "";
      const badgeHtml = badge ? `<span class="list-sync${badge.clickable?' clickable':''}" data-syncid="${f.id}" data-status="${badge.status}" title="${badge.title}" style="${badge.clickable?'cursor:pointer;':''}">${badge.icon}</span>` : "";
      tr.innerHTML = `
        <td class="name">${badgeHtml}${fileTypeInfo(f.file || {name:f.name}).glyph} ${escapeHtml(f.name)}</td>
        <td class="type"><span class="${normalizeCategory(f.category)}">${CATS[normalizeCategory(f.category)].label}</span></td>
        <td class="mono">${formatSize(f.size)}</td>
        <td class="mono">${formatDate(f.addedAt)}</td>
        <td>${appRole === 'admin' ? `<button class="delbtn" data-id="${f.id}">retirer</button>` : ""}</td>
      `;
      tr.addEventListener('click', (e)=>{
        if(e.target.classList.contains('delbtn') || e.target.closest('.list-sync')) return;
        openViewer(f);
      });
      tbody.appendChild(tr);
    });
    contentEl.appendChild(table);
    contentEl.querySelectorAll('.delbtn').forEach(b=>{
      b.addEventListener('click', (e)=>{ e.stopPropagation(); confirmDelete(Number(b.dataset.id)); });
    });
    contentEl.querySelectorAll('.list-sync.clickable').forEach(b=>{
      b.addEventListener('click', (e)=>{
        e.stopPropagation();
        const entry = files.find(x=>x.id===Number(b.dataset.syncid));
        if(entry) syncFileToDrive(entry);
      });
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Viewer modal ----------
  const TEXT_EXTS = ["txt","md","csv","json","log","xml","html","css","js"];

  function attachMediaErrorHandler(box, kind){
    const el = box.querySelector('#viewerMedia');
    if(!el) return;
    el.addEventListener('error', ()=>{
      const warn = document.createElement('p');
      warn.style.cssText = "font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--stamp-red);margin-top:10px;text-align:center;";
      warn.textContent = "Lecture " + kind + " impossible sur cet appareil — essayez « Ouvrir dans un onglet ».";
      box.appendChild(warn);
    });
  }

  function openViewer(f){
    const isReaderFile = !f.file && f.driveFileId;
    const mime = (f.file && f.file.type) || "";
    const ext = extOf(f.name);
    const isPdf = mime === "application/pdf" || ext === "pdf";
    const isImage = mime.startsWith("image/");
    const isText = mime.startsWith("text/") || TEXT_EXTS.includes(ext);
    const openLink = isReaderFile ? `https://drive.google.com/file/d/${f.driveFileId}/view` : f.url;

    let body = `<div style="text-align:center;padding:20px 0;"><div class="glyph big">⏳</div></div>`;

    const modal = buildModal(`
      <div class="eyebrow">Consultation</div>
      <h3>${escapeHtml(f.name)}</h3>
      <div class="infoline">${CATS[normalizeCategory(f.category)].label} · ${formatSize(f.size)} · ajouté le ${formatDate(f.addedAt)}</div>
      <div class="previewbox" id="viewerBox">${body}</div>
      <div class="actions between">
        ${appRole === 'admin' ? `<button class="btn danger small" id="viewerDelete">Retirer ce fichier</button>` : `<span></span>`}
        <div style="display:flex;gap:10px;">
          <button class="btn ghost small" id="viewerOpenTab">Ouvrir dans un onglet</button>
          <button class="btn small" id="viewerClose">Fermer</button>
        </div>
      </div>
    `, true);
    const box = modal.querySelector('#viewerBox');

    if(isReaderFile){
      box.innerHTML = `<iframe src="https://drive.google.com/file/d/${f.driveFileId}/preview" title="${escapeHtml(f.name)}" allow="autoplay" style="width:100%;height:100%;border:1px solid var(--line-soft);background:#fff;"></iframe>`;
    } else if(f.category === "video"){
      box.innerHTML = `<video id="viewerMedia" src="${f.url}" controls playsinline webkit-playsinline preload="metadata" style="width:100%;height:100%;max-height:100%;background:#000;"></video>`;
      attachMediaErrorHandler(box, "vidéo");
    } else if(f.category === "music"){
      box.innerHTML = `<div style="text-align:center;padding:20px 0;"><div class="glyph big">🎵</div><audio id="viewerMedia" src="${f.url}" controls preload="metadata" style="width:100%;margin-top:14px;"></audio></div>`;
      attachMediaErrorHandler(box, "audio");
    } else if(isImage){
      box.innerHTML = `<img id="viewerMedia" src="${f.url}" alt="${escapeHtml(f.name)}">`;
      attachMediaErrorHandler(box, "de l'image");
    } else if(isPdf){
      box.innerHTML = `<iframe src="${f.url}" title="${escapeHtml(f.name)}" style="width:100%;height:100%;border:1px solid var(--line-soft);background:#fff;"></iframe>`;
    } else if(isText && f.file){
      const reader = new FileReader();
      reader.onload = ()=>{
        const txt = String(reader.result).slice(0, 20000);
        box.innerHTML = `<pre style="width:100%;height:100%;overflow:auto;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:14px;margin:0;white-space:pre-wrap;word-break:break-word;">${escapeHtml(txt)}</pre>`;
      };
      reader.onerror = ()=>{
        box.innerHTML = `<div style="text-align:center;padding:30px 0;"><div class="glyph big">${fileTypeInfo(f.file || {name:f.name}).glyph}</div><p style="font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--ink-soft);margin-top:10px;">Impossible de lire ce fichier ici.</p></div>`;
      };
      reader.readAsText(f.file);
    } else {
      box.innerHTML = `<div style="text-align:center;padding:30px 0;"><div class="glyph big">${fileTypeInfo(f.file || {name:f.name}).glyph}</div>
              <p style="font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--ink-soft);margin-top:10px;">Ce type de fichier ne peut pas s'afficher ici — ouvrez-le dans un onglet.</p></div>`;
    }

    modal.querySelector('#viewerOpenTab').addEventListener('click', ()=> window.open(openLink, '_blank'));
    modal.querySelector('#viewerClose').addEventListener('click', closeModal);
    const delBtn = modal.querySelector('#viewerDelete');
    if(delBtn){
      delBtn.addEventListener('click', ()=>{
        closeModal();
        confirmDelete(f.id);
      });
    }
  }

  // ---------- Delete confirm ----------
  function confirmDelete(id){
    const f = files.find(x=>x.id===id);
    if(!f) return;
    const modal = buildModal(`
      <div class="eyebrow">Retirer du classeur</div>
      <h3>Retirer « ${escapeHtml(f.name)} » ?</h3>
      <div class="infoline">Cette action retire le fichier de l'archive pour cette session.</div>
      <div class="actions">
        <button class="btn ghost" id="cancelDel">Annuler</button>
        <button class="btn danger" id="okDel">Retirer</button>
      </div>
    `);
    modal.querySelector('#cancelDel').addEventListener('click', closeModal);
    modal.querySelector('#okDel').addEventListener('click', async ()=>{
      URL.revokeObjectURL(f.url);
      files = files.filter(x=>x.id!==id);
      closeModal();
      renderAll();
      if(localSaveAvailable){
        try{ await dbDelete(id); }catch(e){ /* pas grave, retiré au moins de l'affichage */ }
      }
      showToast("Fichier retiré du classeur.");
    });
  }

  // ---------- Preview-before-add modal ----------
  let lastPickedCat = DEFAULT_CAT;

  function openPreviewModal(file){
    pendingFile = file;
    const kind = fileTypeInfo(file).kind;
    const url = URL.createObjectURL(file);
    let previewHtml = "";
    if(kind === "video"){
      previewHtml = `<video src="${url}" controls playsinline webkit-playsinline preload="metadata" style="width:100%;max-height:220px;background:#000;"></video>`;
    } else if(kind === "audio"){
      previewHtml = `<div style="text-align:center;padding:16px 0;"><div class="glyph big">🎵</div><audio src="${url}" controls style="width:90%;margin-top:10px;"></audio></div>`;
    } else if(kind === "image"){
      previewHtml = `<img src="${url}" alt="">`;
    } else {
      previewHtml = `<div style="text-align:center;padding:30px 0;"><span class="glyph big">${fileTypeInfo(file).glyph}</span></div>`;
    }

    const catOptions = Object.entries(CATS).map(([k,v])=>
      `<option value="${k}" ${k===lastPickedCat?'selected':''}>${v.label}</option>`
    ).join('');

    const modal = buildModal(`
      <div class="eyebrow">Aperçu avant classement</div>
      <h3>Ajouter ce fichier ?</h3>
      <div class="previewbox">${previewHtml}</div>
      <div class="field">
        <label for="renameInput">Nom du fichier</label>
        <input type="text" id="renameInput" value="${escapeHtml(file.name)}">
      </div>
      <div class="field">
        <label for="catSelect">Pupitre</label>
        <select id="catSelect">${catOptions}</select>
      </div>
      <div class="infoline">${formatSize(file.size)}</div>
      <div class="actions">
        <button class="btn ghost" id="cancelAdd">Annuler</button>
        <button class="btn" id="confirmAdd">Classer le fichier</button>
      </div>
    `);
    modal.querySelector('#cancelAdd').addEventListener('click', ()=>{
      URL.revokeObjectURL(url);
      pendingFile = null;
      closeModal();
      processQueue();
    });
    modal.querySelector('#confirmAdd').addEventListener('click', async ()=>{
      const nameInput = modal.querySelector('#renameInput').value.trim() || file.name;
      const cat = normalizeCategory(modal.querySelector('#catSelect').value);
      lastPickedCat = cat;
      const entry = {
        id: idSeq++,
        folderId: currentFolderId,
        file,
        name: nameInput,
        category: cat,
        size: file.size,
        url,
        thumb: null,
        addedAt: new Date()
      };
      files.push(entry);
      closeModal();
      renderAll();

      if(localSaveAvailable){
        try{
          const dbId = await dbAdd({ folderId: currentFolderId, name: nameInput, category: cat, size: file.size, addedAt: entry.addedAt.toISOString(), blob: file });
          entry.id = dbId; // aligne l'id sur celui attribué par la sauvegarde locale
          showToast("Fichier classé et sauvegardé dans « " + CATS[cat].label + " ».");
        }catch(e){
          showToast("Fichier classé (session uniquement — sauvegarde locale indisponible).");
        }
      } else {
        showToast("Fichier classé dans « " + CATS[cat].label + " » (session uniquement).");
      }

      if(kind === "video"){
        makeVideoThumb(url, (dataUrl)=>{
          if(dataUrl){ entry.thumb = dataUrl; if(viewMode==='grid') renderAll(); }
        });
      }

      if(driveClientId){
        entry.driveStatus = 'pending';
        renderAll();
        syncFileToDrive(entry);
      }

      pendingFile = null;
      processQueue();
    });
  }

  // queue multiple files so each gets its own preview step
  let queue = [];
  function processQueue(){
    if(queue.length === 0) return;
    const next = queue.shift();
    openPreviewModal(next);
  }

  // ---------- Modal shell ----------
  function buildModal(innerHtml, fullscreen){
    const cls = fullscreen ? "overlay fullscreen" : "overlay";
    const mcls = fullscreen ? "modal fullscreen" : "modal";
    modalLayer.innerHTML = `<div class="${cls}" id="overlay"><div class="${mcls}" role="dialog" aria-modal="true">${innerHtml}</div></div>`;
    const overlay = document.getElementById('overlay');
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    document.addEventListener('keydown', escListener);
    return overlay.querySelector('.modal');
  }
  function escListener(e){ if(e.key === "Escape") closeModal(); }
  function closeModal(){
    modalLayer.innerHTML = "";
    document.removeEventListener('keydown', escListener);
  }

  // ---------- Input handling ----------
  function handleFiles(fileList){
    const arr = Array.from(fileList);
    if(arr.length === 0) return;
    queue = queue.concat(arr);
    if(!pendingFile) processQueue();
  }

  document.getElementById('pickBtn').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{ handleFiles(e.target.files); fileInput.value = ""; });

  ['dragenter','dragover'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{ e.preventDefault(); dropzone.classList.remove('drag'); });
  });
  dropzone.addEventListener('drop', (e)=>{
    if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });

  document.getElementById('search').addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    renderAll();
  });

  document.getElementById('gridBtn').addEventListener('click', ()=>{
    viewMode = "grid";
    document.getElementById('gridBtn').setAttribute('aria-pressed','true');
    document.getElementById('listBtn').setAttribute('aria-pressed','false');
    renderAll();
  });
  document.getElementById('listBtn').addEventListener('click', ()=>{
    viewMode = "list";
    document.getElementById('listBtn').setAttribute('aria-pressed','true');
    document.getElementById('gridBtn').setAttribute('aria-pressed','false');
    renderAll();
  });

  // ---------- Écran des dossiers ----------
  function folderFileCount(folderId){
    return files.filter(f => f.folderId === folderId).length;
  }

  function voicesPresence(folderId){
    const present = new Set(files.filter(f => f.folderId === folderId).map(f => normalizeCategory(f.category)));
    return Object.keys(CATS).map(k => `<i class="${present.has(k) ? 'filled '+k : ''}" title="${CATS[k].label}"></i>`).join('');
  }

  function renderFoldersScreen(){
    folderGrid.innerHTML = "";
    folders.slice().sort((a,b)=> a.createdAt - b.createdAt).forEach(fold=>{
      const card = document.createElement('div');
      card.className = "folder-card";
      card.tabIndex = 0;
      const count = folderFileCount(fold.id);
      card.innerHTML = `
        <span class="fglyph">🎼</span>
        <div class="fname">${escapeHtml(fold.name)}</div>
        <div class="fcount">${count} fichier${count>1?'s':''}</div>
        <div class="fvoices">${voicesPresence(fold.id)}</div>
        ${appRole === 'admin' ? `<button class="fdel" data-id="${fold.id}">supprimer</button>` : ""}
      `;
      card.addEventListener('click', (e)=>{
        if(e.target.classList.contains('fdel')) return;
        openFolder(fold.id);
      });
      card.addEventListener('keypress', (e)=>{ if(e.key==='Enter') openFolder(fold.id); });
      folderGrid.appendChild(card);
    });

    if(appRole === 'admin'){
      const newCard = document.createElement('div');
      newCard.className = "folder-card new";
      newCard.tabIndex = 0;
      newCard.innerHTML = `<span class="fglyph">＋</span><div class="fname">Nouveau chant</div>`;
      newCard.addEventListener('click', openNewFolderModal);
      newCard.addEventListener('keypress', (e)=>{ if(e.key==='Enter') openNewFolderModal(); });
      folderGrid.appendChild(newCard);
    } else if(appRole === 'reader'){
      const refreshCard = document.createElement('div');
      refreshCard.className = "folder-card new";
      refreshCard.tabIndex = 0;
      refreshCard.innerHTML = `<span class="fglyph">↻</span><div class="fname">Actualiser depuis Drive</div>`;
      refreshCard.addEventListener('click', ()=> loadReaderData());
      refreshCard.addEventListener('keypress', (e)=>{ if(e.key==='Enter') loadReaderData(); });
      folderGrid.appendChild(refreshCard);
      if(folders.length === 0){
        const empty = document.createElement('div');
        empty.className = "empty";
        empty.style.gridColumn = "1 / -1";
        empty.innerHTML = readerApiKey
          ? `<div class="glyph">🗄️</div><h3>Rien à afficher</h3><p>Aucun chant trouvé, ou le partage Drive n'est pas encore configuré.</p>`
          : `<div class="glyph">☁︎</div><h3>Lecture Google Drive non configurée</h3><p>Ouvrez « ☁︎ Google Drive » en haut pour entrer la clé fournie par l'administrateur.</p>`;
        folderGrid.appendChild(empty);
      }
    }

    folderGrid.querySelectorAll('.fdel').forEach(b=>{
      b.addEventListener('click', (e)=>{ e.stopPropagation(); confirmDeleteFolder(Number(b.dataset.id)); });
    });
  }

  function openNewFolderModal(){
    const modal = buildModal(`
      <div class="eyebrow">Nouveau chant</div>
      <h3>Nommer ce chant</h3>
      <div class="field">
        <label for="folderNameInput">Titre du chant</label>
        <input type="text" id="folderNameInput" placeholder="ex. Toi et Moi">
      </div>
      <div class="actions">
        <button class="btn ghost" id="cancelFolder">Annuler</button>
        <button class="btn" id="confirmFolder">Créer le chant</button>
      </div>
    `);
    const input = modal.querySelector('#folderNameInput');
    input.focus();
    modal.querySelector('#cancelFolder').addEventListener('click', closeModal);
    const submit = async ()=>{
      const name = input.value.trim();
      if(!name){ input.focus(); return; }
      await createFolder(name);
      closeModal();
    };
    modal.querySelector('#confirmFolder').addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  }

  async function createFolder(name){
    const fold = { id: folderIdSeq++, name, createdAt: new Date() };
    folders.push(fold);
    if(localSaveAvailable){
      try{
        const dbId = await dbAdd({ name, createdAt: fold.createdAt.toISOString() }, FOLDERS_STORE);
        fold.id = dbId;
      }catch(e){ /* le dossier reste au moins disponible pour cette session */ }
    }
    openFolder(fold.id);
  }

  function confirmDeleteFolder(id){
    const fold = folders.find(x=>x.id===id);
    if(!fold) return;
    const count = folderFileCount(id);
    const modal = buildModal(`
      <div class="eyebrow">Supprimer le chant</div>
      <h3>Supprimer « ${escapeHtml(fold.name)} » ?</h3>
      <div class="infoline">${count > 0 ? `Les ${count} fichier(s) qu'il contient seront aussi retirés.` : "Ce chant est vide."}</div>
      <div class="actions">
        <button class="btn ghost" id="cancelFolderDel">Annuler</button>
        <button class="btn danger" id="okFolderDel">Supprimer</button>
      </div>
    `);
    modal.querySelector('#cancelFolderDel').addEventListener('click', closeModal);
    modal.querySelector('#okFolderDel').addEventListener('click', async ()=>{
      const toRemove = files.filter(f => f.folderId === id);
      toRemove.forEach(f => URL.revokeObjectURL(f.url));
      files = files.filter(f => f.folderId !== id);
      folders = folders.filter(f => f.id !== id);
      closeModal();
      renderFoldersScreen();
      if(localSaveAvailable){
        try{
          await Promise.all(toRemove.map(f => dbDelete(f.id)));
          await dbDelete(id, FOLDERS_STORE);
        }catch(e){ /* la suppression reste au moins visible dans l'app */ }
      }
      showToast("Dossier supprimé.");
    });
  }

  function openFolder(id){
    currentFolderId = id;
    activeCat = "all";
    searchTerm = "";
    document.getElementById('search').value = "";
    const fold = folders.find(f=>f.id===id);
    folderTitle.textContent = fold ? fold.name : "Dossier";
    foldersScreen.style.display = "none";
    folderScreen.style.display = "block";
    searchwrap.style.display = "block";
    dropzone.style.display = appRole === 'admin' ? "block" : "none";
    renderAll();
  }

  document.getElementById('backToFolders').addEventListener('click', ()=>{
    currentFolderId = null;
    folderScreen.style.display = "none";
    foldersScreen.style.display = "block";
    searchwrap.style.display = "none";
    renderFoldersScreen();
  });

  // ---------- Réglages Google Drive ----------
  function openDriveSettings(){
    if(appRole === 'reader'){
      openReaderSettings();
      return;
    }
    const modal = buildModal(`
      <div class="eyebrow">Réglages</div>
      <h3>Google Drive — Administrateur</h3>
      <div class="infoline">Statut : ${driveConnected ? "connecté" : (driveClientId ? "non connecté" : "non configuré")}${(driveConnected && connectedAccountEmail) ? " — " + escapeHtml(connectedAccountEmail) : ""}</div>
      <div class="field">
        <label for="clientIdInput">Client ID Google (OAuth)</label>
        <input type="text" id="clientIdInput" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${driveClientId ? escapeHtml(driveClientId) : ''}">
      </div>
      <div class="infoline">L'origine JavaScript autorisée dans Google Cloud doit correspondre exactement à l'adresse où cette app est hébergée.</div>
      <div class="field">
        <button class="btn small" id="permanentConnectBtn" style="width:100%;">🔒 Connexion permanente (ne plus jamais se reconnecter)</button>
      </div>
      <div class="infoline">Nécessite d'avoir déployé les fonctions serveur de l'app (voir le guide fourni). Sans ça, ce bouton ne fera rien.</div>
      ${driveArchiveRootId ? `
      <div class="field">
        <label>ID du dossier à partager avec vos lecteurs</label>
        <input type="text" id="rootIdDisplay" readonly value="${escapeHtml(driveArchiveRootId)}">
      </div>
      <div class="infoline">Dans Google Drive, partagez ce dossier « Anyone with the link → Lecteur », puis donnez cet ID + votre clé API à vos lecteurs.</div>
      ` : `<div class="infoline">L'ID du dossier à partager apparaîtra ici après votre premier envoi de fichier.</div>`}
      ${driveConnected ? `
      <div class="field">
        <button class="btn ghost small" id="driveSyncBtn" style="width:100%;">↻ Récupérer les nouveautés depuis Drive</button>
      </div>
      <div class="infoline">Utile si vous ajoutez des fichiers depuis un autre appareil, avec le même compte.</div>
      ` : ``}
      <div class="actions between">
        <button class="btn ghost small" id="driveDisconnectBtn" ${driveConnected ? '' : 'style="visibility:hidden;"'}>Se déconnecter</button>
        <div style="display:flex;gap:10px;">
          <button class="btn ghost small" id="driveCloseBtn">Fermer</button>
          <button class="btn small" id="driveSaveBtn">Enregistrer</button>
        </div>
      </div>
      <div class="infoline" style="margin-top:16px;"><a href="#" id="switchToReader" style="color:var(--ink-soft);">Je suis en fait un lecteur →</a></div>
    `);
    modal.querySelector('#driveCloseBtn').addEventListener('click', closeModal);
    modal.querySelector('#permanentConnectBtn').addEventListener('click', startPermanentConnect);
    if(driveConnected){
      modal.querySelector('#driveSyncBtn').addEventListener('click', async ()=>{
        closeModal();
        await pullFromDriveForAdmin(false);
      });
    }
    modal.querySelector('#driveDisconnectBtn').addEventListener('click', ()=>{
      disconnectDrive();
      closeModal();
    });
    modal.querySelector('#driveSaveBtn').addEventListener('click', async ()=>{
      const val = modal.querySelector('#clientIdInput').value.trim();
      if(!val){ showToast("Entrez un Client ID."); return; }
      driveClientId = val;
      await setSetting('driveClientId', val);
      updateDriveStatusUI();
      await initGis(val);
      closeModal();
      connectDrive();
    });
    modal.querySelector('#switchToReader').addEventListener('click', async (e)=>{
      e.preventDefault();
      appRole = 'reader';
      await setSetting('appRole', 'reader');
      files = []; folders = [];
      dropzone.style.display = "none";
      updateDriveStatusUI();
      closeModal();
      openReaderSettings();
    });
  }

  function openReaderSettings(){
    const modal = buildModal(`
      <div class="eyebrow">Réglages</div>
      <h3>Google Drive — Lecteur</h3>
      <div class="infoline">Collez les informations fournies par votre administrateur.</div>
      <div class="field">
        <label for="readerKeyInput">Clé API Google</label>
        <input type="text" id="readerKeyInput" placeholder="AIzaSy…" value="${readerApiKey ? escapeHtml(readerApiKey) : ''}">
      </div>
      <div class="field">
        <label for="readerFolderInput">ID du dossier partagé</label>
        <input type="text" id="readerFolderInput" placeholder="ex. 1AbCdEfGhIjKlmNoPQRstuv" value="${readerRootFolderId ? escapeHtml(readerRootFolderId) : ''}">
      </div>
      <div class="actions between">
        <span></span>
        <div style="display:flex;gap:10px;">
          <button class="btn ghost small" id="readerCloseBtn">Fermer</button>
          <button class="btn small" id="readerSaveBtn">Enregistrer et charger</button>
        </div>
      </div>
      <div class="infoline" style="margin-top:16px;"><a href="#" id="switchToAdmin" style="color:var(--ink-soft);">Je suis en fait l'administrateur →</a></div>
    `);
    modal.querySelector('#readerCloseBtn').addEventListener('click', closeModal);
    modal.querySelector('#readerSaveBtn').addEventListener('click', async ()=>{
      const key = modal.querySelector('#readerKeyInput').value.trim();
      const rawFolder = modal.querySelector('#readerFolderInput').value.trim();
      if(!key || !rawFolder){ showToast("Entrez la clé API et l'ID du dossier."); return; }
      const folderId = extractDriveFolderId(rawFolder);
      if(!folderId){ showToast("L'ID du dossier n'a pas pu être lu — recollez-le."); return; }
      readerApiKey = key;
      readerRootFolderId = folderId;
      await setSetting('readerApiKey', key);
      await setSetting('readerRootFolderId', folderId);
      updateDriveStatusUI();
      closeModal();
      await loadReaderData();
      startReaderPolling();
    });
    modal.querySelector('#switchToAdmin').addEventListener('click', async (e)=>{
      e.preventDefault();
      appRole = 'admin';
      await setSetting('appRole', 'admin');
      stopReaderPolling();
      files = []; folders = [];
      updateDriveStatusUI();
      closeModal();
      await loadAdminLocalData();
      renderFoldersScreen();
    });
  }

  document.getElementById('driveSettingsBtn').addEventListener('click', openDriveSettings);

  // ---------- Thème clair / sombre ----------
  function applyThemeIcons(theme){
    document.getElementById('themeIconSun').style.display = theme === 'dark' ? 'none' : 'block';
    document.getElementById('themeIconMoon').style.display = theme === 'dark' ? 'block' : 'none';
  }
  (function initThemeToggle(){
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    applyThemeIcons(current);
    document.getElementById('themeToggle').addEventListener('click', ()=>{
      const now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', now);
      applyThemeIcons(now);
      try{ localStorage.setItem('archive-theme', now); }catch(e){}
    });
  })();

  // ---------- Démarrage : recharger le classeur sauvegardé ----------
  async function loadAdminLocalData(){
    try{
      const folderRecords = await dbGetAll(FOLDERS_STORE);
      localSaveAvailable = true;
      folderRecords.forEach(rec=>{
        folders.push({
          id: rec.id, name: rec.name, createdAt: new Date(rec.createdAt),
          driveFolderId: rec.driveFolderId || null,
          driveSubfolders: rec.driveSubfolders || null
        });
        folderIdSeq = Math.max(folderIdSeq, rec.id + 1);
      });

      const records = await dbGetAll();
      let needsMigration = false;
      records.forEach(rec=>{
        if(rec.folderId === undefined || rec.folderId === null) needsMigration = true;
      });
      let migrationFolderId = null;
      if(needsMigration){
        if(folders.length === 0){
          const fold = { id: folderIdSeq++, name:"Général", createdAt:new Date() };
          try{
            const dbId = await dbAdd({ name: fold.name, createdAt: fold.createdAt.toISOString() }, FOLDERS_STORE);
            fold.id = dbId;
          }catch(e){ /* reste au moins en mémoire */ }
          folders.push(fold);
          migrationFolderId = fold.id;
        } else {
          migrationFolderId = folders[0].id;
        }
      }

      records.forEach(rec=>{
        const url = URL.createObjectURL(rec.blob);
        const folderId = (rec.folderId === undefined || rec.folderId === null) ? migrationFolderId : rec.folderId;
        const entry = {
          id: rec.id,
          folderId,
          file: rec.blob,
          name: rec.name,
          category: rec.category,
          size: rec.size,
          url,
          thumb: null,
          addedAt: new Date(rec.addedAt),
          driveStatus: rec.driveStatus || null,
          driveFileId: rec.driveFileId || null
        };
        files.push(entry);
        idSeq = Math.max(idSeq, rec.id + 1);
        if(entry.category === "video"){
          makeVideoThumb(url, (dataUrl)=>{
            if(dataUrl){ entry.thumb = dataUrl; if(currentFolderId===folderId && viewMode==='grid') renderAll(); }
          });
        }
      });
    }catch(e){
      localSaveAvailable = false;
    }

    driveClientId = await getSetting('driveClientId');
    driveArchiveRootId = await getSetting('driveArchiveRootId');
    updateDriveStatusUI();
    if(driveClientId){
      await initGis(driveClientId);
      armFirstInteractionReconnect();
    }
  }

  // La reconnexion silencieuse ne fonctionne pas toujours sans geste utilisateur selon le
  // navigateur — on multiplie donc les occasions de la tenter pour qu'elle passe le plus
  // souvent possible inaperçue : immédiatement, au retour sur l'app, et périodiquement.
  let reconnectArmed = false;
  function attemptSilentReconnect(){
    if(!driveClientId || !gisTokenClient || driveConnected) return;
    ensureToken().then(()=>{ retrySyncQueue(); }).catch(()=>{ /* sera retenté automatiquement */ });
  }

  function armFirstInteractionReconnect(){
    // Tentative immédiate, sans attendre de geste — fonctionne dans de nombreux contextes
    // (app installée, session Google déjà active dans ce navigateur).
    attemptSilentReconnect();

    if(reconnectArmed) return;
    reconnectArmed = true;

    // Nouvelle tentative dès que l'app redevient active (on rouvre l'app installée, on
    // revient d'un autre onglet, on rallume l'écran du téléphone).
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible') attemptSilentReconnect();
    });
    window.addEventListener('focus', attemptSilentReconnect);
    window.addEventListener('pageshow', attemptSilentReconnect);

    // Filet de sécurité : le tout premier geste sur la page compte comme une interaction
    // utilisateur valable pour les navigateurs les plus stricts.
    const onFirstInteraction = ()=>{
      document.removeEventListener('click', onFirstInteraction, true);
      document.removeEventListener('touchstart', onFirstInteraction, true);
      attemptSilentReconnect();
    };
    document.addEventListener('click', onFirstInteraction, true);
    document.addEventListener('touchstart', onFirstInteraction, true);

    // Renouvellement proactif : on retente avant l'expiration du jeton (environ toutes les
    // 4 minutes) plutôt que d'attendre que la connexion tombe pendant une utilisation active.
    setInterval(()=>{
      if(document.visibilityState === 'visible') attemptSilentReconnect();
    }, 4 * 60 * 1000);
  }

  function openRoleChooser(){
    const modal = buildModal(`
      <div class="eyebrow">Bienvenue</div>
      <h3>Comment allez-vous utiliser ce classeur ?</h3>
      <div class="infoline">Vous pourrez changer ce choix plus tard dans les réglages.</div>
      <div class="actions" style="flex-direction:column; gap:10px; align-items:stretch;">
        <button class="btn" id="roleAdminBtn" style="width:100%;">Administrateur — j'ajoute et gère les fichiers</button>
        <button class="btn ghost" id="roleReaderBtn" style="width:100%;">Lecteur — je consulte seulement</button>
      </div>
    `);
    modal.querySelector('#roleAdminBtn').addEventListener('click', async ()=>{
      appRole = 'admin';
      await setSetting('appRole', 'admin');
      closeModal();
      await loadAdminLocalData();
      renderFoldersScreen();
    });
    modal.querySelector('#roleReaderBtn').addEventListener('click', async ()=>{
      appRole = 'reader';
      await setSetting('appRole', 'reader');
      closeModal();
      renderFoldersScreen();
      openDriveSettings();
    });
  }

  async function init(){
    appRole = await getSetting('appRole');
    readerApiKey = await getSetting('readerApiKey');
    readerRootFolderId = await getSetting('readerRootFolderId');

    if(appRole === 'admin'){
      await loadAdminLocalData();
      renderFoldersScreen();
    } else if(appRole === 'reader'){
      dropzone.style.display = "none";
      updateDriveStatusUI();
      await loadReaderData();
      if(readerApiKey && readerRootFolderId) startReaderPolling();
    } else {
      renderFoldersScreen();
      openRoleChooser();
    }
  }

  init();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
