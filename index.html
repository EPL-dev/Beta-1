<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Archive — chorale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Archive">
<script>
  // Applique le thème avant le premier rendu pour éviter tout flash de la mauvaise couleur.
  (function(){
    try{
      var saved = localStorage.getItem('archive-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper: #F6F7F5;
  --paper-deep: #EBEDE9;
  --card: #FFFFFF;
  --ink: #16202B;
  --ink-soft: #5B6672;
  --stamp-red: #6E2A35;
  --brass: #96751F;
  --line: #E2E5E1;
  --line-soft: #EDEFEC;
  --soprano-color: #3E5C76;
  --alto-color: #6E2A35;
  --tenor-color: #96751F;
  --basse-color: #2F5D50;
  --focus: #2B6CB0;
  --radius: 10px;
  --shadow-sm: 0 1px 2px rgba(20,24,28,.05), 0 2px 6px rgba(20,24,28,.05);
  --shadow-md: 0 2px 6px rgba(20,24,28,.06), 0 10px 24px rgba(20,24,28,.08);
}

html[data-theme="dark"]{
  --paper: #12161B;
  --paper-deep: #1B2027;
  --card: #1B2027;
  --ink: #EDEFEF;
  --ink-soft: #9AA3AC;
  --stamp-red: #C97C86;
  --brass: #D1A94A;
  --line: #2A3038;
  --line-soft: #232931;
  --soprano-color: #7CA3C4;
  --alto-color: #C97C86;
  --tenor-color: #D1A94A;
  --basse-color: #6FB39D;
  --focus: #6FB1FF;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.25);
  --shadow-md: 0 4px 10px rgba(0,0,0,.35), 0 16px 32px rgba(0,0,0,.4);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background-color:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background-color .2s ease, color .2s ease;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

.app{
  position:relative; z-index:1;
  max-width:1180px;
  margin:0 auto;
  padding:28px 24px 80px;
}

#driveStatusPill{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.6rem;
  text-transform:uppercase; letter-spacing:.06em; padding:1px 6px; border-radius:8px;
  background:var(--paper-deep); margin-left:2px;
}
#driveStatusPill.connected{ background:color-mix(in srgb, var(--basse-color) 18%, transparent); color:var(--basse-color); }
#driveStatusPill.error{ background:color-mix(in srgb, var(--stamp-red) 18%, transparent); color:var(--stamp-red); }

.sync-badge{
  position:absolute; top:-8px; left:-8px; font-size:.85rem;
  background:var(--card); border-radius:50%; width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line); cursor:default;
}
.sync-badge.clickable{ cursor:pointer; }
.sync-badge[data-status="syncing"]{ animation:spin 1.2s linear infinite; }
@keyframes spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
.list-sync{ font-size:.9rem; margin-right:4px; }

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:20px; flex-wrap:wrap;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:28px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.staff-mark{ display:block; flex:0 0 auto; }
.staff-mark line{ stroke:var(--line); stroke-width:1.4; }
.staff-mark circle{ fill:var(--stamp-red); }
.brand h1{
  font-family:'Fraunces',serif; font-weight:600; font-optical-sizing:auto;
  font-size:1.5rem; margin:0; letter-spacing:.01em; color:var(--ink);
}
.brand .tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:.65rem; text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink-soft);
}
.searchwrap{
  flex:1; min-width:220px; max-width:380px;
  position:relative;
}
.searchwrap label{
  display:block; font-family:'IBM Plex Mono',monospace; font-size:.63rem;
  text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); margin-bottom:5px;
}
.searchwrap input{
  width:100%; padding:9px 12px; font-size:.9rem; font-family:'Inter',sans-serif;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--card); color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.searchwrap input:focus{ border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); outline:none; }
.searchwrap input::placeholder{ color:var(--ink-soft); opacity:.8; }

.header-actions{ display:flex; align-items:center; gap:8px; }
.theme-toggle{
  all:unset; cursor:pointer; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line); border-radius:50%; color:var(--ink-soft); background:var(--card);
  transition:border-color .15s, color .15s;
}
.theme-toggle:hover{ color:var(--ink); border-color:var(--ink-soft); }
.theme-toggle svg{ width:17px; height:17px; }

#reconnectBanner{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  background:color-mix(in srgb, var(--stamp-red) 10%, var(--card));
  border:1px solid color-mix(in srgb, var(--stamp-red) 30%, var(--line));
  border-radius:var(--radius); padding:10px 14px; margin-bottom:20px;
  font-family:'Inter',sans-serif; font-size:.85rem; color:var(--ink);
}
#reconnectBanner button{
  all:unset; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:.72rem;
  text-transform:uppercase; letter-spacing:.06em; padding:6px 14px; border-radius:var(--radius);
  background:var(--stamp-red); color:var(--card); white-space:nowrap;
}

/* ---------- Breadcrumb ---------- */
.breadcrumb{
  display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;
}
.breadcrumb .back{
  all:unset; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:.75rem;
  color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px;
}
.breadcrumb .back:hover{ color:var(--ink); }
.breadcrumb h2{ font-family:'Fraunces',serif; margin:0; font-size:1.5rem; }
.breadcrumb .sep{ color:var(--line); }

/* ---------- Folders screen ---------- */
.folders-intro{ margin-bottom:20px; }
.folders-intro h2{ font-family:'Fraunces',serif; font-weight:600; margin:0 0 4px; font-size:1.4rem; }
.folders-intro p{ margin:0; font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--ink-soft); }
.folder-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px;
}
.folder-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 16px; cursor:pointer; position:relative;
  box-shadow:var(--shadow-sm);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.folder-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--line-soft); }
.folder-card .fglyph{ font-size:1.5rem; margin-bottom:10px; display:block; }
.folder-card .fname{ font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; margin-bottom:4px; word-break:break-word; }
.folder-card .fcount{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ink-soft); }
.folder-card .fvoices{ display:flex; gap:5px; margin-top:10px; }
.folder-card .fvoices i{ width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--line); }
.folder-card .fvoices i.filled.soprano{ background:var(--soprano-color); }
.folder-card .fvoices i.filled.alto{ background:var(--alto-color); }
.folder-card .fvoices i.filled.tenor{ background:var(--tenor-color); }
.folder-card .fvoices i.filled.basse{ background:var(--basse-color); }
.folder-card .fdel{
  position:absolute; top:10px; right:10px; all:unset; cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--ink-soft);
  text-decoration:underline; opacity:0; transition:opacity .12s;
}
.folder-card:hover .fdel{ opacity:1; }
.folder-card.new{
  border-style:dashed; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; color:var(--ink-soft); background:transparent; box-shadow:none;
}
.folder-card.new:hover{ background:var(--paper-deep); color:var(--ink); }

/* ---------- Layout ---------- */
.layout{ display:grid; grid-template-columns:210px 1fr; gap:24px; margin-top:24px; }
@media (max-width:760px){ .layout{ grid-template-columns:1fr; } }

/* ================= Mobile ================= */
@media (max-width:640px){
  .app{ padding:16px 14px 60px; }

  header.top{ align-items:flex-start; padding-bottom:12px; margin-bottom:16px; gap:12px; }
  .brand h1{ font-size:1.5rem; }
  .brand .tag{ display:none; }
  .searchwrap{ max-width:none; width:100%; }

  .breadcrumb{ margin-bottom:14px; }
  .breadcrumb h2{ font-size:1.15rem; }

  .folders-intro h2{ font-size:1.15rem; }
  .folder-grid{ grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .folder-card{ padding:14px 12px; }
  .folder-card .fdel{ opacity:1; font-size:.6rem; }

  .layout{ gap:14px; margin-top:14px; }
  nav.drawer{
    flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  nav.drawer button{
    flex:0 0 auto; white-space:nowrap; border-left:none; border-bottom:3px solid transparent;
    border-radius:var(--radius); padding:8px 12px;
  }
  nav.drawer button[aria-pressed="true"]{ border-bottom-color:var(--stamp-red); box-shadow:none; }
  .drawer-note{ display:none; }

  .dropzone{ padding:16px 12px; margin-bottom:16px; }
  .dropzone .slot{ font-size:.95rem; }
  .btn{ padding:10px 16px; }

  .toolbar{ margin-bottom:10px; }
  .toolbar h2{ font-size:1.05rem; }
  .viewtoggle button{ padding:8px 10px; }

  .grid{ grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:12px; }
  .card .thumb{ height:78px; }
  .card .name{ font-size:.76rem; }
  .delbtn{ opacity:1; font-size:.6rem; }

  table.list td, table.list th{ padding:8px 8px; font-size:.78rem; }
  table.list td.mono{ display:none; } /* cache colonnes secondaires sur petit écran */
  table.list th:nth-child(3), table.list th:nth-child(4){ display:none; }

  .overlay{ padding:0; align-items:stretch; }
  .modal{
    max-width:100%; width:100%; border-radius:0; box-shadow:none;
    max-height:100dvh; height:100dvh; display:flex; flex-direction:column;
    padding:16px;
  }
  .modal h3{ font-size:1.05rem; }
  .modal .previewbox{ flex:1; min-height:0; margin:12px 0; }
  .modal .actions{ flex-wrap:wrap; }
  .modal .actions .btn, .modal .actions.between > div{ width:100%; }
  .modal .actions.between{ flex-direction:column-reverse; gap:8px; }
  .modal .actions.between > div{ display:flex; gap:8px; }
  .modal .actions.between > div .btn{ flex:1; }

  .modal.fullscreen{ height:100dvh; max-height:100dvh; }
  .modal.fullscreen .previewbox video,
  .modal.fullscreen .previewbox img{ max-height:100%; }

  .toast{ left:14px; right:14px; transform:none; bottom:14px; text-align:center; }
  .toast.show{ transform:translateY(-6px); }
}

/* ---------- Sidebar / drawer tabs ---------- */
nav.drawer{ display:flex; flex-direction:column; gap:5px; }
nav.drawer button{
  all:unset; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center;
  font-family:'Fraunces',serif; font-size:.98rem; font-weight:500;
  padding:10px 14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  color:var(--ink-soft);
  transition:background-color .12s, border-color .12s, color .12s;
}
nav.drawer button .n{
  font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--ink-soft);
  background:var(--paper-deep); padding:1px 7px; border-radius:10px;
}
nav.drawer button:hover{ background:var(--paper-deep); }
nav.drawer button[aria-pressed="true"]{
  color:var(--ink); border-color:var(--stamp-red); font-weight:600;
  background:color-mix(in srgb, var(--stamp-red) 6%, var(--card));
}
.drawer-note{
  margin-top:18px; padding:12px 14px; border:1px dashed var(--line);
  font-family:'IBM Plex Mono',monospace; font-size:.68rem; line-height:1.5;
  color:var(--ink-soft); border-radius:var(--radius);
}

/* ---------- Main column ---------- */
main{ min-width:0; }

.toolbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px; gap:12px; flex-wrap:wrap;
}
.toolbar h2{
  font-family:'Fraunces',serif; margin:0; font-size:1.3rem;
}
.viewtoggle{ display:flex; border:1px solid var(--ink); border-radius:var(--radius); overflow:hidden; }
.viewtoggle button{
  all:unset; cursor:pointer; padding:7px 13px; font-family:'IBM Plex Mono',monospace;
  font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
  color:var(--ink-soft); background:var(--card);
}
.viewtoggle button + button{ border-left:1px solid var(--ink); }
.viewtoggle button[aria-pressed="true"]{ background:var(--ink); color:var(--card); }

/* ---------- Dropzone ---------- */
.dropzone{
  border:2px dashed var(--line);
  border-radius:var(--radius);
  padding:22px 18px;
  text-align:center;
  margin-bottom:22px;
  background:repeating-linear-gradient(135deg, rgba(0,0,0,.015) 0 10px, transparent 10px 20px);
  transition:border-color .15s, background-color .15s;
}
.dropzone.drag{ border-color:var(--stamp-red); background-color:color-mix(in srgb, var(--stamp-red) 8%, var(--paper)); }
.dropzone p{ margin:0 0 10px; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-soft); }
.dropzone .slot{
  font-family:'Fraunces',serif; font-size:1.05rem; margin-bottom:6px; color:var(--ink);
}
.btn{
  all:unset; cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em;
  padding:9px 18px; border-radius:var(--radius); border:1.5px solid var(--ink);
  background:var(--ink); color:var(--card);
  transition:filter .12s ease, background-color .15s ease, border-color .15s ease;
}
.btn:hover{ filter:brightness(0.88); }
.btn.ghost{ background:transparent; color:var(--ink); }
.btn.ghost:hover{ background:var(--paper-deep); }
.btn.danger{ border-color:var(--stamp-red); background:var(--stamp-red); }
.btn.danger:hover{ filter:brightness(0.88); }
.btn.small{ padding:5px 11px; font-size:.66rem; }
input[type=file]{ display:none; }

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
  border:1px solid var(--line-soft); border-radius:var(--radius); background:var(--card);
}
.empty .glyph{ font-size:2rem; margin-bottom:10px; }
.empty h3{ font-family:'Fraunces',serif; color:var(--ink); margin:0 0 6px; }
.empty p{ margin:0; font-size:.88rem; max-width:340px; margin:0 auto; }

/* ---------- Grid of cards ---------- */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:16px;
}
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); position:relative; cursor:pointer;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--line-soft); }
.card .accent-bar{ height:3px; width:100%; }
.card .thumb{
  height:96px; display:flex; align-items:center; justify-content:center;
  background:var(--paper-deep); margin:10px 10px 0; border-radius:calc(var(--radius) - 4px); overflow:hidden;
}
.card .thumb img{ width:100%; height:100%; object-fit:cover; }
.card .thumb .glyph{ font-size:2.1rem; }
.card .meta{ padding:10px; }
.card .name{
  font-family:'Inter',sans-serif; font-weight:600; font-size:.82rem;
  color:var(--ink); word-break:break-word; margin-bottom:6px; line-height:1.25;
}
.card .sub{
  font-family:'IBM Plex Mono',monospace; font-size:.66rem; color:var(--ink-soft);
  display:flex; justify-content:space-between; align-items:center;
}
.stamp{
  font-family:'IBM Plex Mono',monospace; font-size:.6rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.04em;
  padding:2px 8px; border-radius:20px;
  display:inline-block;
}
.stamp.soprano{ color:var(--soprano-color); background:color-mix(in srgb, var(--soprano-color) 14%, transparent); }
.stamp.alto{ color:var(--alto-color); background:color-mix(in srgb, var(--alto-color) 14%, transparent); }
.stamp.tenor{ color:var(--tenor-color); background:color-mix(in srgb, var(--tenor-color) 14%, transparent); }
.stamp.basse{ color:var(--basse-color); background:color-mix(in srgb, var(--basse-color) 14%, transparent); }

.delbtn{
  position:absolute; bottom:8px; right:8px;
  all:unset; cursor:pointer; font-family:'IBM Plex Mono',monospace;
  font-size:.62rem; color:var(--ink-soft); text-decoration:underline;
  opacity:0; transition:opacity .12s;
}
.card:hover .delbtn, .row:hover .delbtn{ opacity:1; }

/* ---------- List view ---------- */
table.list{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
table.list thead th{
  text-align:left; font-family:'IBM Plex Mono',monospace; font-size:.66rem; text-transform:uppercase;
  letter-spacing:.08em; color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--line);
}
table.list tbody tr{ border-bottom:1px solid var(--line-soft); cursor:pointer; transition:background-color .1s; }
table.list tbody tr:hover{ background:var(--paper-deep); }
table.list td{ padding:10px 12px; font-size:.85rem; vertical-align:middle; }
table.list td.name{ font-weight:600; display:flex; align-items:center; gap:8px; }
table.list td.type span{
  font-family:'IBM Plex Mono',monospace; font-size:.63rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
  padding:2px 8px; border-radius:20px;
}
table.list td.type .soprano{ color:var(--soprano-color); background:color-mix(in srgb, var(--soprano-color) 14%, transparent); }
table.list td.type .alto{ color:var(--alto-color); background:color-mix(in srgb, var(--alto-color) 14%, transparent); }
table.list td.type .tenor{ color:var(--tenor-color); background:color-mix(in srgb, var(--tenor-color) 14%, transparent); }
table.list td.type .basse{ color:var(--basse-color); background:color-mix(in srgb, var(--basse-color) 14%, transparent); }
table.list td.mono{ font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--ink-soft); }

/* ---------- Modals ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,14,18,.5); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
}
.modal{
  background:var(--card); border:1px solid var(--line); border-radius:calc(var(--radius) + 4px);
  max-width:520px; width:100%; padding:24px; box-shadow:var(--shadow-md);
  max-height:88vh; overflow:auto;
}
.modal h3{ font-family:'Fraunces',serif; font-weight:600; margin:0 0 4px; font-size:1.2rem; }
.modal .eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:.65rem; text-transform:uppercase;
  letter-spacing:.12em; color:var(--ink-soft); margin-bottom:10px;
}
.modal .previewbox{
  background:var(--paper-deep); border:1px solid var(--line-soft); margin:14px 0;
  min-height:140px; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.modal .previewbox img, .modal .previewbox video{ width:100%; max-height:280px; }
.modal .previewbox audio{ width:90%; }
.modal .glyph.big{ font-size:3rem; }
.modal .field{ margin-bottom:12px; }
.modal .field label{
  display:block; font-family:'IBM Plex Mono',monospace; font-size:.65rem; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-soft); margin-bottom:4px;
}
.modal .field input[type=text]{
  width:100%; padding:8px 10px; border:1.5px solid var(--ink); border-radius:var(--radius);
  font-family:'Inter',sans-serif; font-size:.88rem; background:var(--card); color:var(--ink);
}
.modal .field select{
  width:100%; padding:8px 10px; border:1.5px solid var(--ink); border-radius:var(--radius);
  font-family:'Inter',sans-serif; font-size:.88rem; background:var(--card); color:var(--ink);
}
.modal .infoline{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-soft); margin-bottom:14px; }
.modal .actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
.modal .actions.between{ justify-content:space-between; }

.modal.fullscreen{
  max-width:100%; width:100%; height:100%; max-height:100%;
  border-radius:0; box-shadow:none; display:flex; flex-direction:column;
}
.overlay.fullscreen{ padding:0; }
.modal.fullscreen .previewbox{
  flex:1; min-height:0; margin:14px 0;
}
.modal.fullscreen .previewbox img,
.modal.fullscreen .previewbox video{ width:auto; max-width:100%; height:100%; object-fit:contain; }
.modal.fullscreen .previewbox iframe{ width:100%; height:100%; }
.modal.fullscreen .previewbox pre{ max-height:100%; height:100%; }
.modal.fullscreen .actions{ flex:0 0 auto; }

/* toast */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--card); font-family:'IBM Plex Mono',monospace;
  font-size:.78rem; padding:10px 18px; border-radius:var(--radius); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  box-shadow:var(--shadow-md);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

        <line x1="0" y1="22" x2="40" y2="22"/>
        <line x1="0" y1="28" x2="40" y2="28"/>

        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>

  <div id="reconnectBanner" style="display:none;"></div>

  <div id="foldersScreen">
    <div class="folders-intro">
      <h2>Vos chants</h2>
      <p>Chaque chant a son propre classement par pupitre — Soprano / Alto / Ténor / Basse — indépendant des autres.</p>
